name: Update People Data

on:
  schedule:
    # Run at 00:00 on day-of-month 1 (Monthly)
    # The user asked for "every 31 days".
    # Exact 31-day intervals drift. Running on the 1st of every month is the standard approximation.
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-people:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # No external dependencies needed for standard lib usage (urllib, json, re)
        # If any were added, we'd install them here.

    - name: Run update script
      run: python scripts/populate_people.py

    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: update people data via automated script"
        file_pattern: "data/unified.json"
