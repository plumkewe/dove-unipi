name: Update Unified Data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Update mode"
        required: false
        default: "sync"
        type: choice
        options:
          - sync
          - full
      department:
        description: "Department to update"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - di
          - dm
      dry_run:
        description: "Run without saving changes (dry run)"
        required: false
        default: false
        type: boolean

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run populate script
        run: |
          cd ${{ github.workspace }}
          ARGS=""

          # Mode selection
          if [ "${{ github.event.inputs.mode }}" = "full" ]; then
            ARGS="$ARGS --full"
          else
            ARGS="$ARGS --sync"
          fi

          # Department selection
          if [ "${{ github.event.inputs.department }}" = "di" ]; then
            ARGS="$ARGS --di-only"
          elif [ "${{ github.event.inputs.department }}" = "dm" ]; then
            ARGS="$ARGS --dm-only"
          fi

          # Dry run
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "Running: python scripts/populate.py $ARGS"
          python scripts/populate.py $ARGS

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet data/unified.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in unified.json"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in unified.json"
          fi

      - name: Prepare PR body
        if: steps.check_changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          cat > pr_body.md << 'ENDOFBODY'
          ## Automated Data Update

          This PR was automatically generated by the **Update Unified Data** workflow.

          ### Configuration
          ENDOFBODY

          echo "- **Mode**: ${{ github.event.inputs.mode }}" >> pr_body.md
          echo "- **Department**: ${{ github.event.inputs.department }}" >> pr_body.md
          echo "" >> pr_body.md

          # Append sync report if exists
          if [ -f sync_report.md ]; then
            cat sync_report.md >> pr_body.md
          fi

          cat >> pr_body.md << 'ENDOFBODY'

          ### Workflow Run
          ENDOFBODY

          echo "- **Triggered by**: @${{ github.actor }}" >> pr_body.md
          echo "- **Run ID**: ${{ github.run_id }}" >> pr_body.md
          echo "" >> pr_body.md
          echo "---" >> pr_body.md
          echo "*This PR was created automatically. Please review the changes before merging.*" >> pr_body.md

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update unified.json with latest scraped data"
          title: "[Auto] Update unified.json data"
          body-path: pr_body.md
          branch: auto/update-unified-data
          delete-branch: true
          labels: |
            automated
            data-update

      - name: Summary
        run: |
          echo "## Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode**: ${{ github.event.inputs.mode }}" >> $GITHUB_STEP_SUMMARY
          echo "**Department**: ${{ github.event.inputs.department }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "**Dry run mode** - No changes were saved" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.check_changes.outputs.changed }}" = "true" ]; then
            echo "**Changes detected** - Pull request created" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ -f sync_report.md ]; then
              cat sync_report.md >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "**No changes** - unified.json is already up to date" >> $GITHUB_STEP_SUMMARY
          fi
