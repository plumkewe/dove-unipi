name: Update Unified Data

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without saving changes (dry run)'
        required: false
        default: false
        type: boolean
      skip_di:
        description: 'Skip DI (Informatica) scraping'
        required: false
        default: false
        type: boolean
      skip_dm:
        description: 'Skip DM (Matematica) scraping'
        required: false
        default: false
        type: boolean

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run populate script
        run: |
          cd ${{ github.workspace }}
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.skip_di }}" = "true" ]; then
            ARGS="$ARGS --skip-di"
          fi
          if [ "${{ github.event.inputs.skip_dm }}" = "true" ]; then
            ARGS="$ARGS --skip-dm"
          fi
          python scripts/populate.py $ARGS

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet data/unified.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in unified.json"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in unified.json"
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update unified.json with latest scraped data"
          title: "[Auto] Update unified.json data"
          body: |
            ## Automated Data Update
            
            This PR was automatically generated by the **Update Unified Data** workflow.
            
            ### Changes
            - Updated `data/unified.json` with the latest scraped data from:
              - DI (Dipartimento di Informatica) website
              - DM (Dipartimento di Matematica) website
              - UniMap
            
            ### Workflow Run
            - **Triggered by**: @${{ github.actor }}
            - **Run ID**: ${{ github.run_id }}
            - **Skip DI**: ${{ github.event.inputs.skip_di }}
            - **Skip DM**: ${{ github.event.inputs.skip_dm }}
            
            ---
            *This PR was created automatically. Please review the changes before merging.*
          branch: auto/update-unified-data
          delete-branch: true
          labels: |
            automated
            data-update

      - name: Summary
        run: |
          echo "## Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "**Dry run mode** - No changes were saved" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.check_changes.outputs.changed }}" = "true" ]; then
            echo "**Changes detected** - Pull request created" >> $GITHUB_STEP_SUMMARY
          else
            echo "**No changes** - unified.json is already up to date" >> $GITHUB_STEP_SUMMARY
          fi
